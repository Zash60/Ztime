<!DOCTYPE html>
<html>
<head><link rel="icon" href="data:,"><meta charset="utf-8"><title>WebCodecs Test</title></head>
<body>
<script src="../js/timer.js"></script>
<script src="../js/generator.js"></script>
<script>
// Sequential chains (shared vm context): loader tests, then generate tests.
const realImport = VideoGenerator._importMuxer;
const realPainter = TimerDisplay.createFramePainter;
const realCheck = VideoGenerator.checkSupport;
let importCalls = 0;
VideoGenerator._importMuxer = async () => {
  importCalls++;
  return { Output: 1, Mp4OutputFormat: 2, BufferTarget: 3, CanvasSource: 4, Quality: 5 };
};
VideoGenerator._muxerPromise = null;
VideoGenerator.loadMuxer().then((m1) => {
  console.assert(m1.CanvasSource === 4, 'loadMuxer must expose CanvasSource');
  return VideoGenerator.loadMuxer();
}).then((m2) => {
  console.assert(m2.Output === 1, 'second loadMuxer must resolve cached module');
  console.assert(importCalls === 1, 'module must be imported once, got ' + importCalls);
  VideoGenerator._importMuxer = async () => ({ Output: 1 });
  VideoGenerator._muxerPromise = null;
  return VideoGenerator.loadMuxer().then(
    () => console.assert(false, 'incomplete module must reject'),
    (err) => console.assert(/vendor\/mediabunny/.test(err.message), 'error must name the vendored path, got ' + err.message)
  );
}).then(() => {
  // A failed load must not wedge retries: reject once, then resolve.
  let attempts = 0;
  VideoGenerator._importMuxer = async () => {
    attempts++;
    if (attempts === 1) throw new Error('flaky-network-test');
    return { Output: 1, Mp4OutputFormat: 2, BufferTarget: 3, CanvasSource: 4, Quality: 5 };
  };
  VideoGenerator._muxerPromise = null;
  return VideoGenerator.loadMuxer().then(
    () => console.assert(false, 'first flaky load must reject'),
    () => VideoGenerator.loadMuxer()
  ).then((m) => {
    console.assert(m.Quality === 5 && attempts === 2, 'retry after failure must re-import and resolve');
  });
}).then(() => {
  console.log('All WebCodecs loader tests passed');
  return runGenerateTests();
}).then(() => {
  console.log('All WebCodecs generate tests passed');
}).catch((err) => {
  console.error('ERROR: unexpected rejection: ' + (err && err.message || err));
});
</script>
<script>
function fakeModule(calls) {
  return {
    Output: class {
      constructor(o) { this.target = o.target; }
      addVideoTrack(s, o) { calls.trackOpts = o; }
      async start() { calls.started = true; }
      async finalize() { calls.finalized = true; }
      async cancel() { calls.cancelled = true; }
    },
    Mp4OutputFormat: class {},
    BufferTarget: class { constructor() { this.buffer = new Uint8Array([9, 9]).buffer; } },
    CanvasSource: class {
      constructor(c, o) { calls.sourceOpts = o; }
      add(t, d) { calls.add.push([t, d]); }
    },
    Quality: class { constructor(o) { calls.quality = o; } },
  };
}

function runGenerateTests() {
  document = { createElement: () => ({ width: 0, height: 0 }) };
  setTimeout = (fn) => { fn(); return 0; };
  TimerDisplay.createFramePainter = () => () => {};
  Blob = function (parts, opts) { runGenerateTests.blob = { parts, type: opts && opts.type }; };
  VideoEncoder = undefined;

  const genCalls = { add: [] };
  VideoGenerator._importMuxer = async () => fakeModule(genCalls);
  VideoGenerator._muxerPromise = null;
  VideoGenerator.checkSupport = async () => ({ ok: true });
  const cfg = { fps: 10, finalTimeMs: 1000, width: 320, height: 240, background: '#000000', font: { family: 'monospace', size: 24, color: '#ffffff' }, format: 'mmm' };
  const expected = VideoGenerator.framePlan(1000, 10);
  const percents = [];
  return new VideoGenerator().generate(cfg, (p) => percents.push(p), () => {}).then(() => {
    console.assert(JSON.stringify(genCalls.add) === JSON.stringify(expected.times.map((t) => [t, expected.duration])), 'source.add must receive exact framePlan timestamps');
    console.assert(JSON.stringify(genCalls.trackOpts) === JSON.stringify(VideoGenerator.trackOptions(10)), 'track must receive trackOptions(fps)');
    console.assert(genCalls.sourceOpts && genCalls.sourceOpts.codec === 'avc', 'source must use avc codec');
    console.assert(genCalls.finalized === true, 'output must be finalized');
    console.assert(runGenerateTests.blob && runGenerateTests.blob.type === 'video/mp4', 'result must be a video/mp4 Blob');
    console.assert(percents.length > 0 && percents.every((p) => Number.isInteger(p)), 'progress must fire rounded ints only');

    let imports = 0;
    VideoGenerator._importMuxer = async () => { imports++; return fakeModule({ add: [] }); };
    VideoGenerator._muxerPromise = null;
    VideoGenerator.checkSupport = async () => ({ ok: false, reason: 'no-h264-test' });
    return new VideoGenerator().generate(cfg).then(
      () => console.assert(false, 'unsupported browser must reject'),
      (err) => {
        console.assert(/no-h264-test/.test(err.message), 'must reject with the gate reason, got ' + err.message);
        console.assert(imports === 0, 'must not import the muxer when unsupported');
      }
    );
  }).then(() => {
    // Non-cancel failures must also free the encoder.
    const failCalls = { add: [] };
    let adds = 0;
    const failMod = fakeModule(failCalls);
    const RealSource = failMod.CanvasSource;
    failMod.CanvasSource = class extends RealSource {
      add(t, d) { if (++adds === 2) throw new Error('encode-broke-test'); super.add(t, d); }
    };
    VideoGenerator._importMuxer = async () => failMod;
    VideoGenerator._muxerPromise = null;
    VideoGenerator.checkSupport = async () => ({ ok: true });
    return new VideoGenerator().generate(cfg).then(
      () => console.assert(false, 'encode failure must reject'),
      (err) => {
        console.assert(/encode-broke-test/.test(err.message), 'must surface the encoder error, got ' + err.message);
        console.assert(failCalls.cancelled === true, 'failure must call output.cancel()');
      }
    );
  }).then(() => {
    const cancelCalls = { add: [] };
    VideoGenerator._importMuxer = async () => fakeModule(cancelCalls);
    VideoGenerator._muxerPromise = null;
    VideoGenerator.checkSupport = async () => ({ ok: true });
    const gen = new VideoGenerator();
    return gen.generate(cfg, () => gen.cancel()).then(
      () => console.assert(false, 'cancelled run must reject'),
      (err) => {
        console.assert(err && err.code === 'CANCELLED', 'cancel must reject with CANCELLED, got ' + (err && err.code));
        console.assert(cancelCalls.cancelled === true, 'cancel must call output.cancel()');
      }
    );
  }).then(() => {
    VideoGenerator.checkSupport = realCheck;
    TimerDisplay.createFramePainter = realPainter;
    VideoGenerator._importMuxer = realImport;
    VideoGenerator._muxerPromise = null;
  });
}
</script>
</body>
</html>
