<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>RoundMs FPS Test</title></head>
<body>
<script src="../js/timer.js"></script>
<script>
// roundMs must quantize to the frame grid of the given fps, then round to ms for display
console.assert(TimerDisplay.roundMs(20, 60) === 17, 'off-grid 20ms at 60fps should snap to frame 1 → 17');
console.assert(TimerDisplay.roundMs(20, 30) === 33, 'off-grid 20ms at 30fps should snap to frame 1 → 33');
console.assert(TimerDisplay.roundMs(16.6667, 60) === 17, '16.6667ms at 60fps should be 17');
console.assert(TimerDisplay.roundMs(50, 60) === 50, '50ms at 60fps should be 50');
// 59.94fps: frame duration ~16.683ms, frame 1 must display 017
console.assert(TimerDisplay.formatTime(1000 / 59.94, 59.94, 'mmm') === '0:00.017', 'frame 1 at 59.94fps should be 0:00.017');

console.log('All RoundMs FPS tests passed');
</script>
</body>
</html>
