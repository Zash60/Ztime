<!DOCTYPE html>
<html>
<head><link rel="icon" href="data:,"><meta charset="utf-8"><title>App No-Container Test</title></head>
<body>
<script src="../js/timer.js"></script>
<script src="../js/generator.js"></script>
<script src="../js/config.js"></script>
<script src="../js/preview.js"></script>
<script src="helpers/no-container-dom.js"></script>
<script src="../js/app.js"></script>
<script>
// On a page without #configContainer/#previewContainer (like this one,
// like every test page), the auto-init must no-op instead of throwing.
// In Node the stub captures the DOMContentLoaded listener; in a real
// browser the real event fires — both paths must stay silent.
let threw = null;
try {
  if (document._listeners && document._listeners['DOMContentLoaded']) {
    document._listeners['DOMContentLoaded']();
  }
} catch (e) { threw = e; }
console.assert(threw === null, 'auto-init without containers must not throw, got: ' + (threw && threw.message));

console.log('All app no-container tests passed');
</script>
</body>
</html>
