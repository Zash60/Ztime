<!DOCTYPE html>
<html>
<head><link rel="icon" href="data:,"><meta charset="utf-8"><title>Harden Test</title></head>
<body>
<script src="../js/timer.js"></script>
<script src="../js/generator.js"></script>
<script src="../js/config.js"></script>
<script>
// Rich DOM stub: per-selector elements with children
const values = { '#fps': '30', '#finalTime': '01:00.367', '#resolution': '1280x720', '#background': '#000000', '#fontFamily': 'monospace', '#fontSize': '150', '#fontColor': '#ffffff', '#timeFormat': 'cc' };
function makeEl(sel) {
  const children = {};
  return {
    value: values[sel] || '', textContent: '', innerHTML: '',
    style: {}, disabled: false, _h: {},
    addEventListener(ev, cb) { this._h[ev] = cb; },
    click() { if (this._h.click) this._h.click(); },
    querySelector(s) { return children[s] || (children[s] = makeEl(s)); },
  };
}
const els = {};
const container = {
  innerHTML: '',
  querySelector: (sel) => (els[sel] || (els[sel] = makeEl(sel))),
  addEventListener: () => {},
};

// 1. Estimate math (pure, single pass): 60.367s @30fps -> ceil(1811.01)=1812 + final frame = 1813 frames
const est = VideoGenerator.estimate({ fps: 30, finalTimeMs: 60367 });
console.assert(est.frames === 1813, 'estimate frames should be 1813, got ' + est.frames);
console.assert(Math.abs(est.seconds - 60.367) < 1e-9, 'estimate seconds should be 60.367, got ' + est.seconds);
console.assert(!('chunks' in est), 'estimate must not report segments anymore');

// 2. Cancel flag lifecycle (+ reset at generate start)
const gen = new VideoGenerator();
console.assert(gen.cancelled === false, 'fresh generator is not cancelled');
gen.cancel();
console.assert(gen.cancelled === true, 'cancel() sets the flag');
gen.generate({ fps: 30, finalTimeMs: 1000 }).catch(() => {});
console.assert(gen.cancelled === false, 'generate() resets the flag at start');

// 3. Error panel, retry, live regions, cancel UI
const panel = new ConfigPanel(container);
console.assert(typeof panel.showError === 'function', 'showError must exist');
console.assert(typeof panel.hideError === 'function', 'hideError must exist');
console.assert(typeof panel.updateEstimate === 'function', 'updateEstimate must exist');
console.assert(typeof panel.onCancel === 'function', 'onCancel must exist');
console.assert(container.innerHTML.includes('aria-live="polite"'), 'status must be a live region');
console.assert(container.innerHTML.includes('role="alert"'), 'error must have alert role');

let generated = 0;
panel.onGenerate(() => { generated++; });
panel.showError('boom');
console.assert(els['#errorMsg'].querySelector('.error-text').textContent === 'boom', 'error text shown');
els['#errorMsg'].querySelector('#retryBtn').click();
console.assert(generated === 1, 'retry must re-trigger generation');
console.assert(els['#errorMsg'].innerHTML === '', 'error cleared after retry');

panel.setGenerating(true);
console.assert(els['#cancelBtn'].style.display !== 'none', 'cancel visible while generating');
console.assert(els['#generateBtn'].disabled === true, 'generate disabled while generating');
let cancelled = 0;
panel.onCancel(() => { cancelled++; });
els['#cancelBtn'].click();
console.assert(cancelled === 1, 'cancel button must fire onCancel');
panel.setGenerating(false);
console.assert(els['#cancelBtn'].style.display === 'none', 'cancel hidden when idle');

// 4. Estimate text
panel.updateEstimate(est);
console.assert(els['#estimate'].textContent.includes('1813'), 'estimate shows frame count');

console.log('All harden tests passed');
</script>
</body>
</html>
