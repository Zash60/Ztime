<!DOCTYPE html>
<html>
<head><link rel="icon" href="data:,"><meta charset="utf-8"><title>VideoGenerator Test</title></head>
<body>
<script src="../js/timer.js"></script>
<script src="../js/generator.js"></script>
<script>
// Test: VideoGenerator class exists
console.assert(typeof VideoGenerator === 'function', 'VideoGenerator must be a function');
// Test: generate() returns a promise
const gen = new VideoGenerator();
console.assert(typeof gen.generate === 'function', 'generate must be a function');
// Test: frameTimes starts at 0 and always ends exactly at finalTimeMs
const t60 = VideoGenerator.frameTimes(60000, 60);
console.assert(t60.length === 3601, '60s at 60fps should give 3601 frame times, got ' + t60.length);
console.assert(t60[0] === 0, 'first frame time must be 0');
console.assert(t60[t60.length - 1] === 60000, 'last frame time must equal finalTimeMs');

// Test: frame painter draws identical text to draw(), but sets static canvas state once
function fakeCanvas() {
  const calls = { fontSets: 0, alignSets: 0, fillTexts: [] };
  const ctx = {
    _font: '', _align: '',
    fillStyle: '', textBaseline: '',
    fillRect() {}, clearRect() {},
    fillText(t) { calls.fillTexts.push(t); },
  };
  Object.defineProperty(ctx, 'font', { get() { return this._font; }, set(v) { calls.fontSets++; this._font = v; } });
  Object.defineProperty(ctx, 'textAlign', { get() { return this._align; }, set(v) { calls.alignSets++; this._align = v; } });
  return { width: 640, height: 100, _calls: calls, getContext() { return ctx; } };
}
const paintOpts = { background: '#000000', font: { family: 'monospace', size: 48, color: '#ffffff' }, format: 'mmm' };
const c1 = fakeCanvas();
const paint = TimerDisplay.createFramePainter(c1, paintOpts);
paint(0, 60); paint(16.666666666666668, 60); paint(33.333333333333336, 60);
console.assert(c1._calls.fontSets === 1, 'painter must set font once for N frames, got ' + c1._calls.fontSets);
console.assert(c1._calls.alignSets === 1, 'painter must set textAlign once for N frames, got ' + c1._calls.alignSets);
const c2 = fakeCanvas();
[0, 16.666666666666668, 33.333333333333336].forEach((t) => TimerDisplay.draw(c2, t, 60, paintOpts));
console.assert(JSON.stringify(c1._calls.fillTexts) === JSON.stringify(c2._calls.fillTexts), 'painter output must match draw() output');

// Test: progress throttle — only fire when the rounded percent actually changes
console.assert(VideoGenerator.shouldReport(23, 23.2) === false, 'same rounded percent must not report');
console.assert(VideoGenerator.shouldReport(23, 23.6) === true, 'changed rounded percent must report');

// Test: bitrate scales with pixel count (~0.25 bits/pixel, integer)
console.assert(VideoGenerator.bitrateFor(1920, 1080, 30) === Math.round(1920 * 1080 * 0.25), '1080p bitrate must be pixels*0.25');
console.assert(VideoGenerator.bitrateFor(3840, 2160, 30) > VideoGenerator.bitrateFor(1920, 1080, 30), '4K bitrate must exceed 1080p');

// Test: framePlan — exact per-frame timestamps in seconds, constant duration
const plan60 = VideoGenerator.framePlan(60000, 60);
console.assert(plan60.times.length === 3601, '60s at 60fps plan must have 3601 times, got ' + plan60.times.length);
console.assert(plan60.times[0] === 0, 'first plan time must be 0');
console.assert(plan60.times[plan60.times.length - 1] === 60, 'last plan time must be exactly 60');
console.assert(plan60.duration === 1 / 60, 'plan duration must be exactly 1/fps');
const planFrac = VideoGenerator.framePlan(60367, 59.94);
console.assert(planFrac.times[planFrac.times.length - 1] === 60.367, 'last fractional plan time must be exactly 60.367');

// Test: trackOptions — frameRate metadata only for integer or standard fractional fps
console.assert(JSON.stringify(VideoGenerator.trackOptions(30)) === JSON.stringify({ frameRate: 30 }), 'integer fps must pass frameRate');
console.assert(JSON.stringify(VideoGenerator.trackOptions(60000 / 1001)) === JSON.stringify({ frameRate: 60000 / 1001 }), '59.94 must pass frameRate');
console.assert(JSON.stringify(VideoGenerator.trackOptions(7.3)) === JSON.stringify({}), 'arbitrary fractional fps must omit frameRate');

// Test: checkSupport gate (mock globals, restore after; promise chain — vm has no top-level await)
VideoGenerator.checkSupport(1280, 720).then((supportNone) => {
  console.assert(supportNone.ok === false && typeof supportNone.reason === 'string', 'missing VideoEncoder must fail with a reason');
  VideoEncoder = { isConfigSupported: async () => ({ supported: false }) };
  return VideoGenerator.checkSupport(1280, 720);
}).then((supportNo) => {
  console.assert(supportNo.ok === false, 'unsupported config must fail');
  VideoEncoder = { isConfigSupported: async (cfg) => ({ supported: cfg.width === 1280 && cfg.codec === 'avc1.420034' }) };
  return VideoGenerator.checkSupport(1280, 720);
}).then((supportYes) => {
  console.assert(supportYes.ok === true, 'supported config must pass');
  VideoEncoder = undefined;
  console.log('All VideoGenerator tests passed');
});
</script>
</body>
</html>
