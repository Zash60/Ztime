<!DOCTYPE html>
<html>
<head><title>Generator Chunking Test</title></head>
<body>
<script src="../js/ffmpeg-loader.js"></script>
<script src="../js/timer.js"></script>
<script src="../js/generator.js"></script>
<script>
// chunkRanges must partition frame indices without gaps or overlaps
const ranges = VideoGenerator.chunkRanges(10, 3);
console.assert(ranges.length === 4, '10 frames in chunks of 3 should give 4 ranges, got ' + ranges.length);
console.assert(ranges[0].start === 0 && ranges[0].end === 3, 'first range should be 0..3');
console.assert(ranges[3].start === 9 && ranges[3].end === 10, 'last range should be 9..10');
const single = VideoGenerator.chunkRanges(6, 600);
console.assert(single.length === 1 && single[0].start === 0 && single[0].end === 6, 'short video should be one chunk');

// frameTimes must start at 0 and ALWAYS end exactly at finalTimeMs (off-by-one fix)
const t60 = VideoGenerator.frameTimes(60000, 60);
console.assert(t60.length === 3601, '60s at 60fps should give 3601 frame times, got ' + t60.length);
console.assert(t60[0] === 0, 'first frame time must be 0');
console.assert(t60[t60.length - 1] === 60000, 'last frame time must equal finalTimeMs');
const t1 = VideoGenerator.frameTimes(1000, 60);
console.assert(t1.length === 61 && t1[60] === 1000, '1s at 60fps: 61 times ending at 1000');
const tShort = VideoGenerator.frameTimes(50, 60);
console.assert(tShort[tShort.length - 1] === 50, 'short video must end exactly at finalTimeMs');

console.log('All generator chunking tests passed');
</script>
</body>
</html>
